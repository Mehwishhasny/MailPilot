# MailPilot Pro - readable light UI on phones, regardless of device theme.
# Email design presets in Campaign Studio remain independent.
[theme]
base = "light"
primaryColor = "#796AC2"
backgroundColor = "#FAFBF7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#25283A"
font = "sans serif"

[theme.light]
primaryColor = "#796AC2"
backgroundColor = "#FAFBF7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#25283A"

# Keep even a user-selected Streamlit Dark setting visually light.
[theme.dark]
primaryColor = "#796AC2"
backgroundColor = "#FAFBF7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#25283A"
