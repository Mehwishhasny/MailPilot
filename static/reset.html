<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset Password | MailPilot Pro</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(125deg,#f7f7fc,#e7f3ed);font:16px system-ui;color:#303449}.card{background:white;padding:32px;border-radius:20px;box-shadow:0 12px 40px #292b3920;width:min(400px,85vw)}h1{font-size:25px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #c7c8d7;font:inherit}button{background:#796ac2;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#message{font-size:14px;line-height:1.5}</style></head>
<body><main class="card"><h1>Reset your password</h1><p id="message">Checking your secure reset link…</p><form id="form" hidden><label>New password<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>Confirm new password<input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button id="submit" type="submit">Update password</button></form><p><a href="/">Back to MailPilot Pro</a></p></main>
<script>
'use strict';
// Replace the following two PUBLIC configuration values from Supabase Project Settings → API.
const SUPABASE_URL = 'PASTE_YOUR_SUPABASE_PROJECT_URL_HERE';
const SUPABASE_PUBLISHABLE_KEY = 'PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE';
const message = document.getElementById('message');
const form = document.getElementById('form');
const submit = document.getElementById('submit');
const fragment = new URLSearchParams(location.hash.slice(1));
const accessToken = fragment.get('access_token');
const type = fragment.get('type');
const error = fragment.get('error_description') || fragment.get('error');
// Remove credentials from the address bar before any requests or user interaction.
history.replaceState(null, '', location.pathname);
async function authRequest(method, path, body) {
  const response = await fetch(SUPABASE_URL.replace(/\/$/, '') + path, {
    method,
    headers: {'apikey': SUPABASE_PUBLISHABLE_KEY, 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json'},
    ...(body ? {body: JSON.stringify(body)} : {}),
    cache: 'no-store',
    referrerPolicy: 'no-referrer'
  });
  if (!response.ok) throw new Error('The recovery session is invalid or expired. Please request a new link.');
  return response.json();
}
(async () => {
  if (error) { message.textContent = 'The reset link has expired or is invalid. Please request a new one.'; return; }
  if (!accessToken || type !== 'recovery') { message.textContent = 'No valid recovery session found. Please request a new password reset email.'; return; }
  if (SUPABASE_URL.includes('PASTE_') || SUPABASE_PUBLISHABLE_KEY.includes('PASTE_')) { message.textContent = 'The reset page is not configured yet.'; return; }
  try { await authRequest('GET', '/auth/v1/user'); message.textContent = 'Enter a new password (at least 12 characters).'; form.hidden = false; }
  catch { message.textContent = 'This recovery session has expired. Please request a new reset email.'; }
})();
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const password = document.getElementById('password').value;
  if (password !== document.getElementById('confirm').value) { message.textContent = 'Passwords do not match.'; return; }
  if (password.length < 12 || password.length > 128) { message.textContent = 'Use between 12 and 128 characters.'; return; }
  submit.disabled = true;
  try { await authRequest('PUT', '/auth/v1/user', {password}); form.hidden = true; message.textContent = 'Password updated successfully. Return to MailPilot Pro and sign in with your new password.'; }
  catch { message.textContent = 'Could not update your password. Request a fresh reset email.'; submit.disabled = false; }
});
</script></body></html>
